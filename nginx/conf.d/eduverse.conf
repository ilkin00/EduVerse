# HTTP to HTTPS Redirect - Tüm domainler için
server {
    listen 80;
    server_name api.eduvers.site app.eduvers.site eduvers.site admin.eduvers.site webrtc.eduvers.site livekit.eduvers.site api-livekit.eduvers.site;
    return 301 https://$server_name$request_uri;
}

# HTTPS - API Backend (api.eduvers.site)
server {
    listen 443 ssl;
    server_name api.eduvers.site;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    access_log /var/log/nginx/api-access.log;
    error_log /var/log/nginx/api-error.log;

    location /docs {
        proxy_pass http://eduverse-backend:8000/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://eduverse-backend:8000/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://eduverse-backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://eduverse-backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://eduverse-backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    location /ws/ {
        proxy_pass http://eduverse-backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    location /health {
        proxy_pass http://eduverse-backend:8000/health;
        proxy_set_header Host $host;
    }
    
    location / {
        proxy_pass http://eduverse-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# HTTPS - WebRTC Signaling (webrtc.eduvers.site)
server {
    listen 443 ssl;
    server_name webrtc.eduvers.site;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/webrtc-access.log;
    error_log /var/log/nginx/webrtc-error.log;

    location / {
        proxy_pass http://eduverse-webrtc:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# HTTPS - LiveKit (livekit.eduvers.site)
server {
    listen 443 ssl;
    server_name livekit.eduvers.site;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/livekit-access.log;
    error_log /var/log/nginx/livekit-error.log;

    # WebSocket için
    location / {
        proxy_pass http://eduverse-livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# HTTPS - LiveKit HTTP API (api-livekit.eduvers.site)
# LiveKit HTTP API'si 7880 portunda da çalışır, sadece HTTP istekleri için
server {
    listen 443 ssl;
    server_name api-livekit.eduvers.site;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/livekit-api-access.log;
    error_log /var/log/nginx/livekit-api-error.log;

    # HTTP API istekleri (WebSocket değil)
    location / {
        proxy_pass http://eduverse-livekit:7880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket upgrade başlıklarını KALDIR (sadece HTTP)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# HTTPS - Mobile App (app.eduvers.site)
server {
    listen 443 ssl;
    server_name app.eduvers.site;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/mobile-access.log;
    error_log /var/log/nginx/mobile-error.log;

    location / {
        proxy_pass http://eduverse-mobile:8081/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cache-Control "no-store";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /sockjs-node/ {
        proxy_pass http://eduverse-mobile:8081/sockjs-node/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Cache-Control "no-store";
    }
}

