# WebSocket upgrade map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Gzip
gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

# API Backend
server {
    listen 80;
    server_name localhost;

    # API endpoints
    location /api/v1/ {
        proxy_pass http://eduverse-backend:8000/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /api/v1/ws/ {
        proxy_pass http://eduverse-backend:8000/api/v1/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Health & docs
    location /health {
        proxy_pass http://eduverse-backend:8000/health;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://eduverse-backend:8000$request_uri;
        proxy_set_header Host $host;
    }

    # LiveKit HTTP
    location /livekit/ {
        proxy_pass http://eduverse-livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Web app (varsayılan)
    location / {
        proxy_pass http://eduverse-web:3500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
